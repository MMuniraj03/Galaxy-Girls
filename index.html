<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050713">
  <title>Galaxy Girls</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main id="game" aria-label="Galaxy Girls game">
    <div class="space-overlay"></div>

    <section id="hud" aria-live="polite">
      <div class="hud-left">
        <div class="panel heroine-panel">
          <div id="healthText">❤️❤️❤️❤️❤️ HEALTH 350/350</div>
          <div class="bar"><div id="healthFill" class="health-fill"></div></div>
        </div>
        <div class="panel progression-panel">
          <div id="bossText">BOSS 1: 25 KILLS</div>
          <div class="bar small"><div id="progressFill" class="progress-fill"></div></div>
        </div>
      </div>

      <div class="hud-right">
        <div class="panel">
          <div id="score">SCORE: 0</div>
          <div id="kills">KILLS: 0</div>
          <div id="gunText">GUN 1 • DAMAGE 50</div>
          <div id="ammo">AMMO: ∞</div>
        </div>
      </div>
    </section>

    <div id="bossWarning" role="status">⚠ BOSS INCOMING ⚠</div>
    <div id="message" aria-live="polite"></div>

    <div id="player" class="player">
      <img id="heroineSprite" src="Heroine standing effect.png" alt="">
      <img id="weaponSprite" class="weapon" src="Gun 1.png" alt="">
    </div>

    <div id="entities"></div>

    <section id="controls" aria-label="Game controls">
      <div class="control-group">
        <button id="leftBtn" type="button" aria-label="Move left">◀</button>
        <button id="rightBtn" type="button" aria-label="Move right">▶</button>
      </div>
      <div class="control-group">
        <button id="jumpBtn" type="button" aria-label="Jump">⬆</button>
        <button id="shootBtn" class="shoot" type="button" aria-label="Fire weapon">FIRE</button>
      </div>
    </section>

    <section id="startScreen" class="screen">
      <div class="screen-card">
        <p class="eyebrow">MISSION 01</p>
        <h1>GALAXY GIRLS</h1>
        <p>Defeat mixed enemy levels, collect upgrades and survive three bosses.</p>
        <div class="mission-info">
          <span>❤️ 350 HP</span>
          <span>🔫 4 GUN LEVELS</span>
          <span>👾 3 BOSSES</span>
        </div>
        <button id="startBtn" class="primary" type="button">START GAME</button>
      </div>
    </section>

    <section id="gameOver" class="screen hidden">
      <div class="screen-card">
        <p class="eyebrow danger">MISSION FAILED</p>
        <h2>GAME OVER</h2>
        <p id="finalStats"></p>
        <button id="restartBtn" class="primary" type="button">PLAY AGAIN</button>
      </div>
    </section>

    <section id="victory" class="screen hidden">
      <div class="screen-card">
        <p class="eyebrow success">MISSION COMPLETE</p>
        <h2>GALAXY SAVED</h2>
        <p id="victoryStats"></p>
        <button id="victoryRestartBtn" class="primary" type="button">PLAY AGAIN</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
